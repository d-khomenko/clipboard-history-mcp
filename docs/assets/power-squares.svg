<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 325" width="500" height="325" role="img" aria-label="Power-draw comparison: a small green Daemon (idle ~1 mW solid, burst ~30 mW dashed) shares a bottom baseline and a vertical edge with a much larger red Chrome tab (Google Doc — idle ~100 mW solid, burst ~500 mW dashed). Square area is proportional to power.">
  <text x="130" y="199" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Daemon</text>
  <text x="130" y="217" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#666">~1 mW idle</text>
  <text x="130" y="235" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#666">~30 mW burst</text>

  <rect x="140" y="185" width="55" height="55" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <rect x="162.5" y="230" width="10" height="10" fill="#16a34a"/>

  <rect x="195" y="15" width="225" height="225" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="257.5" y="140" width="100" height="100" fill="#dc2626"/>

  <text x="307.5" y="258" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Chrome tab (Google Doc)</text>
  <text x="307.5" y="274" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#666">~100 mW idle · ~500 mW burst</text>

  <text x="250" y="302" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#999">Square area is proportional to power.</text>
  <text x="250" y="316" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#999">Dashed outline = transient peak during work.</text>
</svg>
