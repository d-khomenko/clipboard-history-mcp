[package]
name = "clipboard-history-mcp"
version = "0.4.0-alpha.1"
edition = "2021"
rust-version = "1.95"
description = "Type-aware, secret-safe clipboard history exposed to Claude via MCP. macOS + Linux."
license = "MIT"
authors = ["Dmytro Khomenko"]
repository = "https://github.com/d-khomenko/clipboard-history-mcp"

[lib]
path = "src/lib.rs"

[[bin]]
name = "clipboard-history-mcp"
path = "src/main.rs"

[dependencies]
rmcp                       = { version = "1.6", features = ["server", "macros", "transport-io", "local"] }
tokio                      = { version = "1.52", features = ["full"] }

# Cross-platform clipboard / keyring / paths / window
arboard                    = "3"
keyring                    = "4"
keyring-core               = "1"
directories-next           = "2"
active-win-pos-rs          = "0.8"

# Storage & crypto
rusqlite                   = { version = "0.39", features = ["bundled"] }
aes-gcm                    = "0.10"
argon2                     = "0.5"
rand                       = "0.8"
once_cell                  = "1.20"
regex                      = "1.11"

# Serialization / config
serde                      = { version = "1", features = ["derive"] }
serde_json                 = "1"
toml                       = "1.1"

# CLI & logging
clap                       = { version = "4.6", features = ["derive"] }
tracing                    = "0.1"
tracing-subscriber         = { version = "0.3", features = ["env-filter"] }

# Utilities
anyhow                     = "1"
thiserror                  = "2"
schemars                   = "0.9"
sha2                       = "0.10"
uuid                       = { version = "1", features = ["v4"] }
hex                        = "0.4"
url                        = "2.5"
chrono                     = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc                       = "0.2"
ctrlc                      = "3"
rpassword                  = "7"

# macOS-only
[target.'cfg(target_os = "macos")'.dependencies]
objc2                      = "0.6"
objc2-foundation           = "0.3"
objc2-local-authentication = "0.3"
block2                     = "0.6"

# Linux-only
[target.'cfg(target_os = "linux")'.dependencies]
x11rb                      = "0.13"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
strip = "symbols"
codegen-units = 1
