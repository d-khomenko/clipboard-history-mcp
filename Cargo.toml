[package]
name = "clipboard-history-mcp"
version = "0.3.0-alpha.0"
edition = "2021"
rust-version = "1.95"
description = "Type-aware, secret-safe macOS clipboard history exposed to Claude via MCP."
license = "MIT"
authors = ["Dmytro Khomenko"]
repository = "https://github.com/d-khomenko/clipboard-history-mcp"

[lib]
path = "src/lib.rs"

[[bin]]
name = "clipboard-history-mcp"
path = "src/main.rs"

[dependencies]
rmcp                       = { version = "1.6", features = ["server", "macros", "transport-io", "local"] }
tokio                      = { version = "1.52", features = ["full"] }
objc2                      = "0.6"
objc2-app-kit              = { version = "0.3", features = ["NSPasteboard", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation           = "0.3"
objc2-local-authentication = "0.3"
security-framework         = { version = "3.7", features = ["OSX_10_15"] }
security-framework-sys     = "2.12"
accessibility              = "0.1"
rusqlite                   = { version = "0.39", features = ["bundled"] }
aes-gcm                    = "0.10"
serde                      = { version = "1", features = ["derive"] }
serde_json                 = "1"
toml                       = "1.1"
clap                       = { version = "4.6", features = ["derive"] }
tracing                    = "0.1"
tracing-subscriber         = { version = "0.3", features = ["env-filter"] }
anyhow                     = "1"
thiserror                  = "2"
schemars                   = "0.9"
sha2                       = "0.10"
uuid                       = { version = "1", features = ["v4"] }
hex                        = "0.4"
rand                       = "0.8"
once_cell                  = "1.20"
regex                      = "1.11"
ctrlc                      = "3"
url                        = "2.5"
libc                       = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
codegen-units = 4

# Original settings (re-enable for distribution builds):
# lto = "fat"
# codegen-units = 1
