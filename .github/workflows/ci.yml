name: CI

on:
  push:
    branches: [main, v4-linux]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux deps
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libxcb1-dev pkg-config xvfb gnome-keyring

      - name: cargo fmt --check
        run: cargo fmt -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test (macOS)
        if: startsWith(matrix.os, 'macos')
        run: cargo test --release

      - name: cargo test (Linux, headless)
        if: contains(matrix.os, 'ubuntu')
        shell: bash
        run: |
          eval $(dbus-launch --sh-syntax)
          eval $(echo -n "" | gnome-keyring-daemon --unlock)
          eval $(echo -n "" | gnome-keyring-daemon --start --components=secrets)
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 2
          cargo test --release
