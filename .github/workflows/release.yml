name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: clipboard-history-mcp

jobs:
  build-macos:
    name: Build macOS universal binary
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable (both targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-cargo-

      - name: Build aarch64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p target/universal-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/${{ env.BINARY_NAME }} \
            target/x86_64-apple-darwin/release/${{ env.BINARY_NAME }} \
            -output target/universal-apple-darwin/${{ env.BINARY_NAME }}
          lipo -info target/universal-apple-darwin/${{ env.BINARY_NAME }}

      - name: Pack .mcpb
        run: |
          npm install -g @anthropic-ai/mcpb
          bash scripts/pack-mcpb.sh

      - name: Upload .mcpb artifact
        uses: actions/upload-artifact@v7
        with:
          name: clipboard-history-mcp-mcpb
          path: clipboard-history-mcp.mcpb

  cargo-publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-publish-

      - name: Verify package
        run: cargo package --list >/dev/null

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --token "$CARGO_REGISTRY_TOKEN"

  mcp-publish:
    name: Publish to MCP Registry
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Download .mcpb artifact
        uses: actions/download-artifact@v4
        with:
          name: clipboard-history-mcp-mcpb

      - name: Extract tag version (strip leading 'v')
        id: tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Compute .mcpb sha256
        id: hash
        run: |
          sha256=$(openssl dgst -sha256 -r clipboard-history-mcp.mcpb | awk '{print $1}')
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
          echo "::notice::clipboard-history-mcp.mcpb sha256=${sha256}"

      - name: Substitute server.json placeholders
        run: |
          sed -i \
            -e "s|__VERSION__|${{ steps.tag.outputs.version }}|g" \
            -e "s|__SHA256__|${{ steps.hash.outputs.sha256 }}|g" \
            server.json
          echo "--- server.json after substitution ---"
          cat server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" -o /tmp/mcp-publisher.tar.gz
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp
          sudo mv /tmp/mcp-publisher /usr/local/bin/
          mcp-publisher --version

      - name: Login (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish to registry
        run: mcp-publisher publish

  release:
    name: Create GitHub Release
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download .mcpb artifact
        uses: actions/download-artifact@v8
        with:
          name: clipboard-history-mcp-mcpb

      - name: Extract tag version
        id: tag
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            clipboard-history-mcp.mcpb
